version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: metro_risk_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_risk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_risk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: metro_risk_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/project_risk_db
      - MODEL_PATH=ml_models/risk_model.joblib
      - METADATA_PATH=ml_models/model_metadata.json
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
